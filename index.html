<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DL Barcode Scan Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
    background: #f7f7f8;
    color: #1a1a2e;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .status {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 500;
  }
  .status-loading { background: #dbeafe; color: #1e40af; }
  .status-ready { background: #d1fae5; color: #065f46; }
  .status-error { background: #fee2e2; color: #991b1b; }
  .status-working { background: #fef3c7; color: #92400e; }

  .scan-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .scan-btn:active { background: #1d4ed8; }

  #photo-input { display: none; }

  .preview {
    max-width: 100%;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
  }

  .log {
    background: #fff;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    padding: 12px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .result-box {
    display: none;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .result-success { display: block; background: #d1fae5; border: 2px solid #10b981; }
  .result-fail { display: block; background: #fee2e2; border: 2px solid #ef4444; }

  .field { margin-bottom: 6px; }
  .field-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; }
  .field-value { font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<h1>DL Barcode Scan Test</h1>
<p style="font-size:13px; color:#6b7280; margin-bottom:16px;">Testing PDF417 barcode scanning. Take a photo of the <strong>back</strong> of a driver license.</p>

<div class="status status-loading" id="status">Loading barcode scanner…</div>

<button class="scan-btn" id="scan-btn" disabled onclick="document.getElementById('photo-input').click()">
  📷 Scan Driver License
</button>
<input type="file" accept="image/*" capture="environment" id="photo-input" />

<img id="preview" class="preview" />

<div class="log" id="log"></div>

<div class="result-box" id="result-box">
  <div id="result-fields"></div>
</div>

<script type="module">
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const scanBtn = document.getElementById('scan-btn');
  const preview = document.getElementById('preview');
  const resultBox = document.getElementById('result-box');
  const resultFields = document.getElementById('result-fields');

  function log(msg) {
    const ts = new Date().toLocaleTimeString();
    logEl.textContent += `[${ts}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status status-' + type;
  }

  // ---- LOAD SCANNER ----
  let detector = null;

  async function initScanner() {
    log('Checking native BarcodeDetector…');

    // Try native first
    if ('BarcodeDetector' in window) {
      try {
        const formats = await BarcodeDetector.getSupportedFormats();
        log('Native formats: ' + formats.join(', '));
        if (formats.includes('pdf417')) {
          detector = new BarcodeDetector({ formats: ['pdf417'] });
          log('Using NATIVE BarcodeDetector (pdf417 supported)');
          setStatus('Ready — native scanner', 'ready');
          scanBtn.disabled = false;
          return;
        }
      } catch (e) {
        log('Native BarcodeDetector error: ' + e.message);
      }
    } else {
      log('Native BarcodeDetector not available');
      log('Secure context: ' + window.isSecureContext);
      log('Protocol: ' + location.protocol);
    }

    // Fall back to polyfill
    log('Loading ZXing WASM polyfill…');
    try {
      const module = await import('https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/index.min.js');
      log('Polyfill module loaded');

      const PolyDetector = module.BarcodeDetectorPolyfill || module.default;
      if (!PolyDetector) {
        // Check all exports
        log('Module exports: ' + Object.keys(module).join(', '));
        throw new Error('BarcodeDetectorPolyfill not found in module');
      }

      const polyFormats = await PolyDetector.getSupportedFormats();
      log('Polyfill formats: ' + polyFormats.join(', '));

      detector = new PolyDetector({ formats: ['pdf417'] });
      log('Using POLYFILL BarcodeDetector');
      setStatus('Ready — polyfill scanner', 'ready');
      scanBtn.disabled = false;

    } catch (e) {
      log('Polyfill load FAILED: ' + e.message);
      log('Stack: ' + e.stack);
      setStatus('Scanner failed to load — see log', 'error');
    }
  }

  // ---- SCAN PHOTO ----
  document.getElementById('photo-input').addEventListener('change', async function() {
    const file = this.files[0];
    if (!file) return;

    log('Photo captured: ' + file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB, ' + file.type + ')');
    setStatus('Processing photo…', 'working');
    scanBtn.disabled = true;

    // Show preview
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.style.display = 'block';

    // Reset result
    resultBox.className = 'result-box';
    resultBox.style.display = 'none';

    try {
      log('Creating ImageBitmap…');
      const bitmap = await createImageBitmap(file);
      log('Bitmap created: ' + bitmap.width + 'x' + bitmap.height);

      if (!detector) throw new Error('Scanner not initialized');

      log('Running barcode detection…');
      const startTime = performance.now();
      const results = await detector.detect(bitmap);
      const elapsed = (performance.now() - startTime).toFixed(0);
      bitmap.close();

      log('Detection complete in ' + elapsed + 'ms');
      log('Barcodes found: ' + results.length);

      if (results.length > 0) {
        const barcode = results[0];
        log('Format: ' + barcode.format);
        log('Raw length: ' + barcode.rawValue.length + ' chars');
        log('Raw value (first 200): ' + barcode.rawValue.substring(0, 200));

        // Parse AAMVA
        const parsed = parseAAMVA(barcode.rawValue);
        showResult(parsed);
        setStatus('Barcode read successfully!', 'ready');
      } else {
        log('No barcodes detected in image');
        setStatus('No barcode found — try again with better lighting', 'error');
      }

    } catch (e) {
      log('ERROR: ' + e.message);
      log('Stack: ' + e.stack);
      setStatus('Scan failed — see log', 'error');
    }

    scanBtn.disabled = false;
    scanBtn.textContent = '📷 Scan Again';
    this.value = '';
  });

  // ---- AAMVA PARSER ----
  function parseAAMVA(raw) {
    const fields = {};
    const fieldMap = {
      'DCS': 'lastName', 'DCT': 'firstName', 'DAC': 'firstName',
      'DAB': 'lastName', 'DBB': 'dob', 'DAG': 'street', 'DAH': 'street2',
      'DAI': 'city', 'DAJ': 'state', 'DAK': 'zip', 'DAQ': 'licenseNum',
      'DBA': 'expiry', 'DAY': 'suffix', 'DAD': 'middleName', 'DBD': 'issued',
    };

    const lines = raw.split(/[\n\r\x1e\x1d\x0a\x0d]+/);
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.length < 4) continue;
      const code = trimmed.substring(0, 3);
      const value = trimmed.substring(3).trim();
      if (fieldMap[code] && value && !fields[fieldMap[code]]) {
        fields[fieldMap[code]] = value;
      }
    }

    if (fields.zip) {
      fields.zip = fields.zip.replace(/\s+/g, '').substring(0, 10);
      if (fields.zip.length > 5 && !fields.zip.includes('-'))
        fields.zip = fields.zip.substring(0, 5) + '-' + fields.zip.substring(5);
    }
    if (fields.dob && fields.dob.length === 8)
      fields.dob = fields.dob.substring(0,2) + '/' + fields.dob.substring(2,4) + '/' + fields.dob.substring(4);

    return fields;
  }

  function titleCase(s) { return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }

  function showResult(parsed) {
    const display = [
      { label: 'Name', value: [parsed.firstName, parsed.middleName, parsed.lastName].filter(Boolean).map(titleCase).join(' ') },
      { label: 'DOB', value: parsed.dob },
      { label: 'License #', value: parsed.licenseNum },
      { label: 'Address', value: [parsed.street, parsed.street2].filter(Boolean).map(titleCase).join(' ') },
      { label: 'City/State/ZIP', value: [parsed.city ? titleCase(parsed.city) : '', parsed.state, parsed.zip].filter(Boolean).join(', ') },
    ].filter(d => d.value);

    resultFields.innerHTML = display.map(d =>
      `<div class="field"><div class="field-label">${d.label}</div><div class="field-value">${d.value}</div></div>`
    ).join('');

    resultBox.className = 'result-box result-success';
    resultBox.style.display = 'block';

    log('Parsed fields: ' + JSON.stringify(parsed, null, 2));
  }

  // ---- INIT ----
  initScanner();
</script>
</body>
</html>
